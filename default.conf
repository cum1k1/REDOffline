//void default()
{
  // Individual channel parameters
  double factor[] = { 5, 5, 5, 5 };
  int nfactor = sizeof(factor)/sizeof(factor[0]);           // The proper way would be to use countof,
                                                            // which is unavailable here, so we use this trick.
  proc->SetPulseDetectThreshold(nfactor, factor);           // Number of baseline sigmas in a threshold;
  proc->SetPulseDetectThreshold(23, 10.);                   // This will set value for [23]. The array will be extended
                                                            // using the last value of the array, if necessary.
  double baseline[] = { 0., 0., 0., 0. };
  proc->SetBaselineExpected(4, baseline);                   // Center of baseline search window width for each channel;
  double deviation[] = { 0.3, 0.3, 0.3, 0.3 };
  proc->SetBaselineDeviation(4, deviation);                 // Half of baseline search window width
  double start_time[] = { 0. };
  proc->SetBaselineStartTime(1, start_time);                // Set start values of baseline search time interval;
  double end_time[] = { 0. };
  proc->SetBaselineEndTime(1, end_time);                    // Set end values of baseline search time interval;

  // Common channel parameters
  proc->SetFitVariation(0.001);                             // Set a reagion of fitting for amplitude histogram;
  proc->SetFitVariationMultiplier(1);                       // To change region of fitting for some types of signal;
  proc->SetProcedureChoiceRelation(0.11);                   // In RED-1 used for different types of muons;
  proc->SetUseAbsoluteThreshold(false);                     // Treat threshold as fixed value instead of scale to noise
  proc->SetUseThresholdInPulse(false);                      // Calculate pulse are using above noise samples only

  // PulseFinder parameters: pulses
  proc->SetPulseMinDuration(0);                             // Minimal pulse duration
  proc->SetPulseMinInterval(0);                             // Minimal time distance between pulses

  if (gROOT->FindObject("corr")) {
    // Corrector parameters
    TObject *obj = gROOT->FindObject("corr");
    if (obj->IsA() == TClass::GetClass("RED::CorrectorBallistic")) {
      RED::CorrectorBallistic *corr = (RED::CorrectorBallistic*)gROOT->FindObject("corr");
      corr->SetPulseFinderName("proc");
      double tau[] = { 1.e-3 };
      corr->SetCorrectionTau(1, tau);                       // Set tau for channel waveform correction;
      double threshold[] = { 0. };
      corr->SetCorrectionThreshold(1, threshold);           // Set threshold for channel waveform correction;
    }
    if (obj->IsA() == TClass::GetClass("RED::CorrectorLowFrequency")) {
      RED::CorrectorLowFrequency *corr = (RED::CorrectorLowFrequency*)gROOT->FindObject("corr");
      corr->SetPulseFinderName("proc");
      corr->SetChunkDuration(3.75e-6);
      corr->SetCutFrequency(2.5e6);
      corr->SetPrePulseMargin(4.e-9);
      corr->SetPostPulseMargin(20.e-9);
      corr->SetThresholdSignal(0,0.010);
      corr->SetThresholdNoise(0,0.003);
    }
  }

  // ClusteringModule parameters
  cl->SetHSLSChannels(false);                               // If detector has both
                                                            // Low Sensetivity and High Sensetivity channels
                                                            // then true; else - false;
  cl->SetNumPMTs(0);                                        // Number of PMT in the detector;
  cl->SetPulseIntervalBound(1.0e-7);                        // Max time distance between pulses in cluster;
                                                            // depend on the detector.
                                                            // Known values:
                                                            // CsI   : 2e-6;
                                                            // Z3    : 1e-7;
                                                            // RED-1 : 1e-7;
  // RemoveModule parameters
  mremove->SetSaveWaveformData(false);                      // To save waveforms -> true

  //output->SetUseLegacyMode(true);                           // save data to output file in old style

}
